name: Update Singularity Profile Telemetry

on:
  schedule:
    # Runs daily at 00:15 UTC (07:15 ICT)
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate Singularity SVGs and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node .github/scripts/generate-profile.mjs

      - name: Commit and push updated telemetry
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No telemetry changes since last run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "chore(telemetry): update Singularity profile artwork [skip ci]"
          git push
