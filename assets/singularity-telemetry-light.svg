<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="468" viewBox="0 0 1200 468" role="img" aria-label="Mission telemetry for Antigravity III: 3 years on GitHub, 1,360 contributions, 319 active days (87.4%), longest streak 112 days, peak day 516 commits.">
<style>
.frame{animation:fade 1s ease-out both}
.orbit{stroke-dasharray:690;animation:draw 2.6s cubic-bezier(0.16, 1, 0.3, 1) .35s both}
.orbit-fill{animation:fade 1.2s ease-out 2.1s both}
.peak{animation:fade .6s ease-out 2.3s both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out 2.7s infinite}
.ro{animation:rise .85s cubic-bezier(0.16, 1, 0.3, 1) both}
.seg{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.scan{animation:scan 2.2s cubic-bezier(.4,0,.2,1) .2s both}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:690}}
@keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes scan{0%{opacity:.9;transform:translateX(0)}85%{opacity:.5}100%{opacity:0;transform:translateX(1160px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
