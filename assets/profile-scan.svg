<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Dat Pham - Profile Scan">
  <defs>
    <filter id="crtGreen">
      <feColorMatrix type="matrix" values="
        0.08 0.16 0.04 0 0
        0.38 0.72 0.16 0 0.02
        0.14 0.26 0.08 0 0
        0    0    0    1 0"/>
    </filter>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="crtLines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.24"/>
    </pattern>
    <clipPath id="avatarClip">
      <rect x="24" y="52" width="224" height="224" rx="4"/>
    </clipPath>
    <style>
      .bg { fill: #070c09; }
      .panel { fill: #0b140f; stroke: #1d4d32; stroke-width: 1.2; }
      .header-bar { fill: #0e1d15; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #39ff88; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .muted { fill: #4f8f69; font-size: 11px; }
      .key { fill: #58b87e; font-size: 12px; font-weight: 700; }
      .val { fill: #d8ffe6; font-size: 12px; }
      .accent { fill: #39ff88; font-size: 12px; font-weight: 700; }
      .scanline { animation: sweep 3.2s linear infinite; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes sweep {
        0% { transform: translateY(-40px); }
        100% { transform: translateY(250px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect class="bg" width="840" height="300" rx="10"/>
  <rect x="1" y="1" width="838" height="298" rx="9" fill="none" stroke="#1f5c3a" stroke-width="1.5"/>

  <rect class="header-bar" x="2" y="2" width="836" height="32" rx="8"/>
  <line x1="2" y1="34" x2="838" y2="34" stroke="#1d4d32" stroke-width="1"/>
  <circle cx="20" cy="18" r="4.5" fill="#1f5c3a"/>
  <circle cx="35" cy="18" r="4.5" fill="#2c8a55"/>
  <circle cx="50" cy="18" r="4.5" fill="#39ff88"/>
  <text x="70" y="22" class="mono title">PROFILE_SCAN // DATPHALM@GITHUB</text>
  <text x="695" y="22" class="mono muted">STATUS: ONLINE</text>
  <circle cx="815" cy="18" r="3.5" fill="#39ff88" class="blink"/>

  <!-- Left Panel: Real Avatar with CRT Green Filter + Radar Sweep -->
  <rect class="panel" x="20" y="48" width="232" height="232" rx="4"/>
  <g clip-path="url(#avatarClip)">
    <image href="data:image/jpeg;base64," x="24" y="52" width="224" height="224" preserveAspectRatio="xMidYMid slice" filter="url(#crtGreen)"/>
    <rect x="24" y="52" width="224" height="36" fill="url(#scanGrad)" class="scanline"/>
  </g>
  <rect x="24" y="52" width="224" height="224" rx="4" fill="none" stroke="#39ff88" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Right Panel: USER INFO -->
  <rect class="panel" x="268" y="48" width="552" height="232" rx="4"/>
  <text x="286" y="72" class="mono title">&gt; USER_INFO</text>
  <line x1="286" y1="81" x2="802" y2="81" stroke="#183d28" stroke-width="1"/>

  <text x="286" y="104" class="mono key">NAME</text>
  <text x="388" y="104" class="mono val">Dat Pham (@datphalm)</text>

  <text x="286" y="126" class="mono key">FOCUS</text>
  <text x="388" y="126" class="mono val">AI Agent Security, Systems &amp; Data Tooling</text>

  <text x="286" y="148" class="mono key">LANGUAGES</text>
  <text x="388" y="148" class="mono accent">Go  ·  Rust  ·  Python  ·  TypeScript  ·  C++</text>

  <text x="286" y="170" class="mono key">INTERNALS</text>
  <text x="388" y="170" class="mono val">OS Sandboxing, MITM Proxies, Arrow/Parquet</text>

  <text x="286" y="192" class="mono key">FLAGSHIP</text>
  <text x="388" y="192" class="mono accent">ghostcage (Go)  |  parqdiff (Rust)</text>

  <line x1="286" y1="210" x2="802" y2="210" stroke="#183d28" stroke-width="1"/>

  <text x="286" y="234" class="mono muted">STANDARDS</text>
  <text x="388" y="234" class="mono val">Zero-dep static binaries · Fail-closed · Fuzz/Race</text>

  <text x="286" y="262" class="mono accent">$ ghostcage doctor &amp;&amp; parqdiff --meta-only</text>
  <rect x="596" y="251" width="8" height="13" fill="#39ff88" class="blink"/>

  <rect width="840" height="300" rx="10" fill="url(#crtLines)" pointer-events="none"/>
</svg>
